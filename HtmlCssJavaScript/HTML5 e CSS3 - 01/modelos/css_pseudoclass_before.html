<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8"/>
		<title>CSS3</title>
		<style>
		p:before
		{
		content:"Read this -";
		}
		</style>
	</head>
	
	<body>
	<p>Meu nome é Barata</p>
	<p>Moro por aí nos cantos da cidade</p>

	<p><b>Obs.:</b> Para :before funcione no IE8, o DOCTYPE deve ser declarado.</p>
	</body>
	
</html>
