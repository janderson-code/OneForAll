<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8"/>
		<title>CSS3</title>
		<style>
		ul.a {list-style-position:inside;}
		ul.b {list-style-position:outside;}
		</style>
	</head>
	
	<body>
	<p>A lista a seguir utiliza list-style-position: inside:</p>
	<ul class="a">
		<li>Café</li>
		<li>Chá</li>
		<li>Refrigerante</li>
	</ul>

	<p>A lista a seguir utiliza list-style-position: outside:</p>
	<ul class="b">
		<li>Café</li>
		<li>Chá</li>
		<li>Refrigerante</li>
	</ul>

<p>"list-style-position: outside" é a configuração padrão.</p>
	</body>
	
</html>
