<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8"/>
		<title>CSS3</title>
		<style>
			p.serif{
			font-family:"Times New Roman",Times,serif;
			}
			p.sansserif{
			font-family:Arial,Helvetica,sans-serif;
			}
		</style>
	</head>
	
	<body>
	<h1>CSS - font-family</h1>
	<p class="serif">Esse é um parágrafo com visualização da fonte "The Times New Roman".</p>
	<p class="sansserif">Esse é um parágrafo com visualização da fonte "Arial".</p>
	</body>
	
</html>
