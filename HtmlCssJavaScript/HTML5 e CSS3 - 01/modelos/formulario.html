<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8"/>
		<title>HTML5</title>
	</head>
	<body>

		<form>
			<input type="hidden" name="codigo_dos_produto" value="034, 035"/>
			<p><label for="name">Nome </label><input type="text" id= "name" name="nome" maxlength="35"/></p>
			<p><label for="senha">Senha </label><input type="password" id="senha" name="senha" maxlength="8" required></p>
			<p><label for="noticias">Escolha </label><input type="checkbox" id="noticias" name="noticias" value="Artes"/></p>
			<p><label for="upload">Envie </label><input type="file" id="upload" name="upload"/></p>
			<p><label for="clicar">Clique </label><input type="image" id="clicar" name="enviar" src="imagens/botao.png"alt="Botão enviar"/></p>
			<p><label for="tamanho">Escolha </label><input type="radio" id="tamanho" name="tamanho" value="pequeno"/></p>
			<p><label for="somar">Calcule </label><input type="button" id="somar" name="somar" value="Somar" /></p>
			<p><label for="limpar">Limpar </label><input type="reset" id="limpar" name="limpar" value="Limpar dados" /></p>
			<p><label for="enviar">Enviar </label><input type="submit" id="enviar" name="enviar" value="Enviar dados"/></p>
		</form>

	</body>
</html>
