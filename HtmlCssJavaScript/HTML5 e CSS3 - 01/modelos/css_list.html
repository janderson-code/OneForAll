<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8"/>
		<title>CSS3</title>
		<style>
		ul.gif{list-style-image:url('imagens/marcador_quadrado.gif');}
		ul.a {list-style-type:circle;}
		ul.b {list-style-type:square;}
		ol.c {list-style-type:upper-roman;}
		ol.d {list-style-type:lower-alpha;}
		</style>
	</head>
	
	<body>
	<ul class="gif">
	<li>Coffee</li>
	<li>Tea</li>
	<li>Coca Cola</li>
	</ul>
	
	<ul class="a">
	<li>Coffee</li>
	<li>Tea</li>
	<li>Coca Cola</li>
	</ul>

	<ul class="b">
	<li>Coffee</li>
	<li>Tea</li>
	<li>Coca Cola</li>
	</ul>

	<ol class="c">
	<li>Coffee</li>
	<li>Tea</li>
	<li>Coca Cola</li>
	</ol>

	<ol class="d">
	<li>Coffee</li>
	<li>Tea</li>
	<li>Coca Cola</li>
	</ol>
	</body>
	
</html>
