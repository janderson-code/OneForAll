<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8"/>
		<title>CSS3</title>
		<style>
		p.normal {font-weight:normal;}
		p.light {font-weight:lighter;}
		p.thick {font-weight:bold;}
		p.thicker {font-weight:900;}
		</style>
	</head>
	
	<body>
	<p class="normal">Esse é um parágrafo com o texto normal.</p>
	<p class="light">Esse é um parágrafo com o texto light.</p>
	<p class="thick">Esse é um parágrafo com o texto thick.</p>
	<p class="thicker">Esse é um parágrafo com o texto thicker.</p>
	</body>
	
</html>
