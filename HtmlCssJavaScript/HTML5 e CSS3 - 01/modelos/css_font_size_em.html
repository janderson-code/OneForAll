<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8"/>
		<title>CSS3 - font-size em "em"</title>
		<style>
		h1 {font-size:2.5em;} /* 40px/16=2.5em */
		h2 {font-size:1.875em;} /* 30px/16=1.875em */
		p {font-size:0.875em;} /* 14px/16=0.875em */
		</style>
	</head>
	
	<body>
	<h1>Cabeçalho 1 - CSS - font-size em "em"</h1>
	<h2>Cabeçalho 2</h2>
	<p>Essa linha é um Parágrafo.</p>
	<p>Especificando o tamanho da fonte em "em", permite que os navegadores Internet Explorer 9, Firefox, Chrome, Opera e Safari redimensionar o texto.</p>
	<p><b>Obs:</b> Esse exemplo não funciona em versões anteriores do IE 9.</p>
	</body>
	
</html>
