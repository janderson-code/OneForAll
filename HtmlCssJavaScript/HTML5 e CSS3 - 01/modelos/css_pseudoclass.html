<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8"/>
		<title>CSS3</title>
		<style>
		a:link {color:#FF0000;}    /* link sem visita - unvisited link */
		a:visited {color:#00FF00;} /* link visitado - visited link */
		a:hover {color:#FF00FF;}   /* link com mouse sobre - mouse over link */
		a:active {color:#0000FF;}  /* link selecionado - selected link */
		</style>
	</head>
	
	<body>
	<p><b><a href="css_text.html" target="_blank">Esse texto é um link</a></b></p>
	<p><b>Obs.:</b> Na deifinição do CSS, deve seguir as seguintes ordens: a:link, a:visited e a:hover, para que se torne eficaz.</p>
	<p><b>Obs.:</b> Na deifinição do CSS, deve seguir as seguintes ordens: a:hover e depois a:active, para que se torne eficaz.</p>
	</body>
	
	
</html>
