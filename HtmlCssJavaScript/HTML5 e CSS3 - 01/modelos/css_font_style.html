<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8"/>
		<title>CSS3</title>
		<style>
		p.normal {font-style:normal;}
		p.italic {font-style:italic;}
		p.oblique {font-style:oblique;}
		</style>
	</head>
	
	<body>
	<p class="normal">Esse é um parágrafo com estilo normal.</p>
	<p class="italic">Esse é um parágrafo com estilo italic.</p>
	<p class="oblique">Esse é um parágrafo com estilo oblique.</p>
	</body>
	
</html>
