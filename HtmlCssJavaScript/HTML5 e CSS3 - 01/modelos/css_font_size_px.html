<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8"/>
		<title>CSS3 - font-size em "px"</title>
		<style>
		h1 {font-size:40px;}
		h2 {font-size:30px;}
		p {font-size:14px;}
		</style>
	</head>
	
	<body>
	<h1>Cabeçalho 1 - CSS - font-size em "px"</h1>
	<h2>Cabeçalho 2</h2>
	<p>Essa linha é um Parágrafo.</p>
	<p>Especificando o tamanho da fonte em px, permite que os navegadores Internet Explorer 9, Firefox, Chrome, Opera e Safari redimensionar o texto.</p>
	<p><b>Obs:</b> Esse exemplo não funciona em versões anteriores do IE 9.</p>
	</body>
	
</html>
