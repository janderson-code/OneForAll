<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8"/>
		<title>CSS3</title>
		<style>
		input:focus
		{
		background-color:yellow;
		}
		</style>
	</head>
	
	<body>
	<p>Clique dentro do campo de texto para visualizar o fundo em amarelo:</p>

	<form>
	Nome: <input type="text" name="firstname" /><br>
	Sobrenome: <input type="text" name="lastname" />
	</form>

	<p><b>Obs:</b> Para :focus funcionar no IE8, o DOCTYPE deve ser declarado.</p>
	</body>
	
	
</html>
